<div class="album-card">
  <div class="card-header">
    <div class="cover-image">
      @if (coverImageUrl()) {
        <img [src]="coverImageUrl()" [alt]="album().title + ' cover'" />
      } @else {
        <div class="no-cover">
          <span>♪</span>
        </div>
      }
    </div>

    <div class="album-info">
      <h3 class="album-title">{{ album().title }}</h3>
      <div class="artists">
        <span class="artist">{{ artistNames() }}</span>
      </div>
      <div class="release-date">{{ formattedReleaseDate() }}</div>
    </div>

    <div class="view-button">
      <button class="btn btn-primary" (click)="viewAlbum()">
        View Album
      </button>
    </div>
  </div>

  <div class="card-content">
    <!-- Genres -->
    <div class="genres">
      @for (genre of album().genres; track genre) {
        <span class="genre-tag">{{ genre }}</span>
      }
    </div>

    <!-- Album Information -->
    <div class="album-details">
      <div class="info-row">
        <span class="label">Created:</span>
        <span class="value">{{ album().createdAt | date:'short' }}</span>
      </div>
    </div>
  </div>
</div>
